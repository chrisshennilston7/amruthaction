<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GCP Actions Tic-Tac-Toe</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#e8eefc;background:#101522}
    body{min-height:100vh;display:grid;place-items:center;margin:0}
    main{text-align:center;width:min(92vw,420px)}
    h1{margin-bottom:.25rem}p{color:#aebbd5}
    #board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2rem auto}
    button{aspect-ratio:1;border:1px solid #53617c;border-radius:14px;background:#192238;color:#7cc4ff;font-size:3rem;font-weight:700;cursor:pointer}
    button:hover{background:#23304d}
    #reset{aspect-ratio:auto;padding:.75rem 1.2rem;font-size:1rem;color:#fff}
  </style>
</head>
<body>
<main>
  <h1>GCP Actions Tic-Tac-Toe</h1>
  <p id="status">Player X starts</p>
  <section id="board" aria-label="Tic-tac-toe board"></section>
  <button id="reset">New game</button>
</main>
<script>
const board=document.querySelector('#board'),status=document.querySelector('#status');
let cells=Array(9).fill(''),turn='X',done=false;
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function render(){board.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.setAttribute('aria-label','Cell '+(i+1));b.onclick=()=>play(i);board.appendChild(b)})}
function play(i){if(cells[i]||done)return;cells[i]=turn;const win=wins.some(w=>w.every(n=>cells[n]===turn));if(win){done=true;status.textContent='Player '+turn+' wins!'}else if(cells.every(Boolean)){done=true;status.textContent='Draw!'}else{turn=turn==='X'?'O':'X';status.textContent='Player '+turn+'\u2019s turn'}render()}
document.querySelector('#reset').onclick=()=>{cells=Array(9).fill('');turn='X';done=false;status.textContent='Player X starts';render()};render();
</script>
</body>
</html>
